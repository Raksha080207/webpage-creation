<body>

<div class="container">

<h2>Select Payment Method</h2>

<div class="option">
<div class="left">
<input type="radio" name="payment" value="Credit/Debit Card">
<td><a href="credit.html"><font color="#000080"><b>Credit/Debit Card</b></font></a></td>
</div>
</div>

<div class="option">
<div class="left">
<input type="radio" name="payment" value="Net Banking">
<td><a href="netbanking.html"><font color="#000080"><b>Net Banking</b></font></a></td>
</div>
</div>


</div>

<button onclick="continuePayment()">Continue</button>

<p id="result"></p>

</div>

<script>
function continuePayment(){
    var payments = document.getElementsByName("payment");
    var selected = "";

    for(var i=0; i<payments.length; i++){
        if(payments[i].checked){
            selected = payments[i].value;
        }
    }

    if(selected == ""){
        alert("Please select a payment method");
    }else{
        document.getElementById("result").innerHTML =
        "You selected: <b>" + selected + "</b>";
    }
}
</script>
